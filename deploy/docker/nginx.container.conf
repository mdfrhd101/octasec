# OctaSec — in-container nginx (octasec-web).
# Semantics mirror deploy/nginx.conf: marketing at /, portal SPA at /portal/,
# API proxied to the octasec-api container. TLS and the public server_name
# live on the HOST nginx (sites-available/octasec.ai), which proxies 127.0.0.1:8611.
#
# Real client IP: traffic arrives Cloudflare -> host nginx -> this container.
# This container must NEVER trust a client-supplied X-Forwarded-For: always
# build the header with $proxy_add_x_forwarded_for. Sanitizing XFF at the
# host nginx / Cloudflare boundary (so $remote_addr's peer passes the true
# client through) is a deployment-side change handled separately.

server {
    listen 8080;
    server_name _;

    # behind the host proxy: never emit scheme/host/port in redirects
    absolute_redirect off;

    root /usr/share/nginx/html/web;     # Next.js static export (web/out)
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Block hidden/sensitive files even if one is ever synced into the web root.
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(map|bak|old|orig|sql|env)$ { deny all; }

    # ---- API: reverse-proxy to the Express backend ----
    # (helmet in the API sets the security headers for /api — not duplicated here)
    location /api/ {
        proxy_pass http://octasec-api:8610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # the website check runs bounded probes for up to ~2 minutes; nginx's 60s default turned slow
        # checks into 504s while the API kept working (and kept the visitor's slot busy)
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
    # scan-engine webhook carries up to 2 MB of findings (nginx default body limit is 1 MB)
    location /api/engine/ {
        client_max_body_size 3m;
        proxy_pass http://octasec-api:8610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---- Portal (React SPA, built with base "/portal/") ----
    location = /portal { return 301 /portal/; }
    # ^~ : the portal wins over the generic static-asset regex below
    location ^~ /portal/assets/ {
        include snippets/octasec-headers.conf;
        alias /usr/share/nginx/html/portal/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /portal/ {
        include snippets/octasec-headers.conf;
        # Portal talks to the same-origin API (/api), so connect-src 'self' is enough.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'" always;
        add_header Cache-Control "no-cache";
        alias /usr/share/nginx/html/portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    # security.txt
    location = /.well-known/security.txt {
        include snippets/octasec-headers.conf;
        default_type text/plain;
    }

    # Long-cache static assets (filenames are content-hashed / cache-busted).
    # content-hashed Next.js build files never change under the same URL: cache for a year
    # (a regex location, so the deny rules above still apply to it)
    location ~ ^/_next/static/ {
        include snippets/octasec-headers.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    # other static files keep their URL when replaced (og.png, logos, icons): cache, but not "immutable"
    location ~* \.(?:css|js|jpg|jpeg|png|webp|avif|svg|woff2?)$ {
        include snippets/octasec-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Marketing site (Next.js export uses trailingSlash dirs with index.html).
    location / {
        include snippets/octasec-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://plausible.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache";
        # no /index.html fallback: unknown paths must return the real 404 page, not the homepage with 200
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
