# OctaSec — nginx config for a Contabo VPS.
# Serves three apps on one domain:
#   /         → marketing site   (Next.js static export,  web/out  → /var/www/octasec/web)
#   /portal/  → customer portal  (React/Vite build,       portal/dist → /var/www/octasec/portal)
#   /api/     → backend API      (Express on 127.0.0.1:5050, run under pm2/systemd)
#
# Install:
#   sudo cp deploy/octasec-headers.conf /etc/nginx/snippets/octasec-headers.conf
#   sudo cp deploy/nginx.conf           /etc/nginx/sites-available/octasec
#   sudo ln -s /etc/nginx/sites-available/octasec /etc/nginx/sites-enabled/octasec
#   sudo nginx -t && sudo systemctl reload nginx
# Replace octasec.ai with your real domain before going live.

# ---- HTTP: ACME + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name octasec.ai www.octasec.ai;
    location /.well-known/acme-challenge/ { root /var/www/octasec/web; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name octasec.ai www.octasec.ai;

    root /var/www/octasec/web;      # Next.js static export (contents of web/out)
    index index.html;

    # TLS — filled in by `certbot --nginx -d octasec.ai -d www.octasec.ai`
    # ssl_certificate     /etc/letsencrypt/live/octasec.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/octasec.ai/privkey.pem;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Block hidden/sensitive files even if one is ever synced into the web root.
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(map|bak|old|orig|sql|env)$ { deny all; }

    # ---- API: reverse-proxy to the Express backend ----
    # The backend binds 127.0.0.1 only and sets `trust proxy: 1`; this proxy
    # APPENDS the real client IP to X-Forwarded-For, which the rate limiter needs.
    location /api/ {
        include snippets/octasec-headers.conf;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Portal (React SPA, built with base "/portal/") ----
    location = /portal { return 301 /portal/; }
    location /portal/ {
        include snippets/octasec-headers.conf;
        # Portal talks to the same-origin API (/api), so connect-src 'self' is enough.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
        alias /var/www/octasec/portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    # security.txt
    location = /.well-known/security.txt {
        include snippets/octasec-headers.conf;
        default_type text/plain;
    }

    # Long-cache static assets (filenames are content-hashed / cache-busted).
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?)$ {
        include snippets/octasec-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Marketing site (Next.js export uses trailingSlash dirs with index.html).
    location / {
        include snippets/octasec-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    error_page 404 /404.html;
}
