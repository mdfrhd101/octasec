# Shared security headers for OctaSec.
# nginx add_header does NOT inherit into a location that sets its own add_header,
# so this snippet is `include`d in EVERY location block (not just the server block).
# Install to: /etc/nginx/snippets/octasec-headers.conf
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
